name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  linux:
    name: Linux (cross-platform tests, real Whisper/Piper)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('build/dependencies.json') }}
      - name: Fetch and verify speech models
        shell: pwsh
        run: ./build/fetch-models.ps1
      - name: Build
        run: dotnet build Vedar.sln -c Release
      - name: Test (net10.0)
        run: dotnet test --project tests/Vedar.Tests/Vedar.Tests.csproj -c Release -f net10.0 --no-build

  windows:
    name: Windows (UI Automation, DPAPI, registry, installer)
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('build/dependencies.json') }}
      - name: Fetch and verify speech models
        shell: pwsh
        run: ./build/fetch-models.ps1
      - name: Build
        run: dotnet build Vedar.sln -c Release
      - name: Publish self-contained win-x64
        shell: pwsh
        run: ./build/publish.ps1
      - name: Test (net10.0)
        run: dotnet test --project tests/Vedar.Tests/Vedar.Tests.csproj -c Release -f net10.0 --no-build
      - name: Test (net10.0-windows — WPF keyboard/UIA, DPAPI, registry, FlaUI end-to-end)
        run: dotnet test --project tests/Vedar.Tests/Vedar.Tests.csproj -c Release -f net10.0-windows --no-build
      - name: Create installer
        shell: pwsh
        run: ./build/create-installer.ps1
      - name: Installer end-to-end test (install, start, exit, uninstall)
        shell: pwsh
        run: ./build/test-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VEDAR-Setup-v0.1.0-x64
          path: |
            dist/VEDAR-Setup-v0.1.0-x64.exe
            dist/VEDAR-Setup-v0.1.0-x64.exe.sha256
          retention-days: 14
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: |
            tests/Vedar.Tests/bin/Release/**/TestResults/**
            ${{ runner.temp }}/vedar-setup.log
          if-no-files-found: ignore
          retention-days: 14
